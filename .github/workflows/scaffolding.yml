name: Scaffolding

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-generated-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create and configure a disposable project copy
        run: |
          fixture_dir="$(mktemp -d)"
          rsync -a --exclude .git --exclude node_modules --exclude .next ./ "$fixture_dir/"
          cd "$fixture_dir"
          pnpm install --frozen-lockfile
          SETUP_APP_NAME="Northstar Operations" SETUP_ORGANIZATION_NAME="Northstar" SETUP_ADMIN_EMAIL="admin@northstar.test" SETUP_INCLUDE_DEMO_MODULES=false pnpm run setup -- --force --yes
          test -f .env
          grep -q 'NEXT_PUBLIC_APP_NAME="Northstar Operations"' .env
      - name: Generate and validate both feature modes in isolated copies
        run: |
          repo_root="$PWD"
          for mode in crud read-only; do
            fixture_dir="$(mktemp -d)"
            rsync -a --exclude .git --exclude node_modules --exclude .next "$repo_root/" "$fixture_dir/"
            cd "$fixture_dir"
            pnpm install --frozen-lockfile
            if [ "$mode" = read-only ]; then pnpm generate:feature asset-registers -- --read-only; else pnpm generate:feature cost-centers; fi
            pnpm db:generate
            pnpm lint
            pnpm typecheck
            pnpm test:legacy
            cd "$repo_root"
          done
      - name: Confirm source checkout stayed clean
        run: git diff --exit-code
